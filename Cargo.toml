[package]
name = "visidata-rs"
version = "0.0.0"
edition = "2024"
description = "Modal terminal data explorer. Polars + Ratatui + mlua. Pre-alpha."
license = "GPL-3.0-or-later"
rust-version = "1.88"

[[bin]]
name = "vdrs"
path = "src/main.rs"

[dependencies]
polars = { version = "0.44", features = ["lazy", "csv", "parquet", "json", "ipc", "strings", "temporal", "dtype-full", "regex", "pivot", "round_series", "sql", "is_in"] }
polars-ops = { version = "0.44", features = ["pivot"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
regex = "1"
flate2 = "1"
calamine = "0.38"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-width = "0.2"  # already pulled in by ratatui; display widths of cells

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
