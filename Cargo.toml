[package]
name = "visidata-rs"
version = "0.1.1"
edition = "2024"
description = "Modal terminal data explorer. Polars + Ratatui + mlua. Pre-alpha."
license = "GPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/neumann-mlucas/visidata-rs"
homepage = "https://neumann-mlucas.github.io/visidata-rs/"
readme = "README.md"
keywords = ["tui", "data", "polars", "csv", "parquet"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "vdrs"
path = "src/main.rs"

[dependencies]
polars = { version = "0.55", features = ["lazy", "csv", "parquet", "json", "ipc", "strings", "temporal", "dtype-full", "dtype-extension", "regex", "pivot", "round_series", "sql", "is_in"] }
polars-ops = { version = "0.55", features = ["pivot"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "send"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tempfile = "3"
regex = "1"
flate2 = "1"
calamine = "0.38"
rusqlite = { version = "0.41", features = ["bundled"] }
unicode-width = "0.2"  # already pulled in by ratatui; display widths of cells

[dev-dependencies]
portable-pty = "0.9.0"
serde_json = "1"
vt100 = "0.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
