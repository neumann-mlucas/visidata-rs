name: ci
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      - name: VisiData replay corpus (pinned; tests/vd_replay.rs reads ../visidata)
        run: |
          git init -q ../visidata
          git -C ../visidata fetch -q --depth 1 https://github.com/saulpw/visidata 5f67ff8af28c59a8f7429e396601606f2ac8dd47
          git -C ../visidata checkout -q FETCH_HEAD
      - name: Export round-trip tools (golden cases run the generated scripts)
        run: |
          python3 -m venv "$HOME/rt"
          "$HOME/rt/bin/pip" install -q polars
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"
      - run: just check --no-fail-fast
        env:
          CARGO_TARGET_DIR: target # rust-cache caches ./target, not .cargo/config.toml's shared dir
          VDRS_PYTHON: /home/runner/rt/bin/python
          VDRS_REQUIRE_ROUNDTRIP: "1"
