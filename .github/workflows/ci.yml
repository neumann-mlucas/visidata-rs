name: ci
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --no-deps --all-targets -- -D warnings
      - name: VisiData replay corpus (pinned; tests/vd_replay.rs reads ../visidata)
        run: |
          git init -q ../visidata
          git -C ../visidata fetch -q --depth 1 https://github.com/saulpw/visidata 5f67ff8af28c59a8f7429e396601606f2ac8dd47
          git -C ../visidata checkout -q FETCH_HEAD
      - name: Export round-trip tools (golden cases run the generated scripts)
        run: |
          python3 -m venv "$HOME/rt"
          "$HOME/rt/bin/pip" install -q polars
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"
      - run: cargo test --no-fail-fast
        env:
          VDRS_PYTHON: /home/runner/rt/bin/python
          VDRS_REQUIRE_ROUNDTRIP: "1"
